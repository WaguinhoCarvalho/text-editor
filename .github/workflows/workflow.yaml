name: Integração continua

# on: pull_request (para qual pull request - todas as branch)
on:
  push:
    branch: [develop]

jobs:
  integracao-continua:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Using Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 16.
      - name: run install, build and test
        run: |
          npm install
          npm run build 
          npm run test